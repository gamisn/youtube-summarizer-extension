<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="popup">
    <div class="header-row">
      <h1>YouTube Summarizer</h1>
      <span id="tierBadge" class="badge badge-free">FREE</span>
    </div>
    <div id="quota" class="quota"></div>

    <div class="row">
      <label for="summaryType">Summary style</label>
      <select id="summaryType">
        <option value="bullets">Bullets</option>
        <option value="key_takeaways">Key takeaways</option>
        <option value="detailed">Detailed</option>
      </select>
    </div>

    <div class="row">
      <label for="customPrompt">Custom instruction (optional)</label>
      <textarea id="customPrompt" rows="2" placeholder="e.g. focus on pricing and action items"></textarea>
    </div>

    <button id="summarizeBtn">Summarize current video</button>
    <button id="exportBtn" class="secondary">Copy / Export .md</button>

    <div id="licenseSection" class="license-box hidden">
      <label for="licenseKey">Premium license key</label>
      <input type="text" id="licenseKey" placeholder="Paste license key" />
      <button id="activateBtn">Activate</button>
      <a id="upgradeLink" href="#" class="upgrade-link">Get Premium — unlimited, long videos, export →</a>
    </div>

    <div id="manageLicense" class="license-managed hidden">
      Premium is active. Manage billing in your Lemon Squeezy email receipt.
    </div>

    <div id="status"></div>
    <pre id="result" class="hidden"></pre>

    <button id="openOptionsBtn" class="link-button">Settings</button>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
